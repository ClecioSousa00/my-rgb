appId: com.myrgb.app
productName: MyRGB
copyright: Copyright © 2026 ClecioSousa00

directories:
  output: release
  buildResources: build

# node-hid 3.x ships N-API v4 prebuilds for every supported platform
# (linux-x64, win32-x64, darwin-*). N-API is ABI stable, so the same binary
# works in Node and in Electron and no source compilation is needed - which
# also means the Windows installer can be produced from Linux.
npmRebuild: false
buildDependenciesFromSource: false

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # Never ship a locally compiled binding: at runtime pkg-prebuilds prefers
  # build/Release over the prebuilds, which would load the Linux binary on
  # Windows. The prebuilds carry the right binary for every platform.
  - '!node_modules/node-hid/build/**'
  - '!node_modules/node-hid/hidapi/**'
  - '!node_modules/node-hid/src/**'

# Runtime assets.
#
# A platform block (linux:, win:) *replaces* the top-level `extraResources`
# instead of merging with it, so anything a platform needs is repeated inside
# its own block. The top-level list stays as the default for the targets that
# do not declare one (and for `--dir` builds).
extraResources:
  # App and tray icons, resolved at runtime by `src/main/resources.ts`.
  - from: build
    to: build
    filter:
      - '*.png'

asar: true
compression: maximum

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  synopsis: Controle de iluminação RGB para placas ASUS AURA
  description: >-
    Controle direto de controladores ASUS AURA USB via HID, com 34 efeitos
    prontos, autoria visual de efeitos e o mesmo comportamento no Linux e no
    Windows.
  desktop:
    entry:
      Name: MyRGB
      Comment: Controle de iluminação RGB para placas ASUS AURA
      Categories: Utility;Settings;
  # Derives the .desktop filename from package.json "desktopName" so that it
  # matches StartupWMClass and Electron's app_id, letting the desktop
  # environment link the running window to the launcher entry.
  syncDesktopName: true
  extraResources:
    - from: build
      to: build
      filter:
        - '*.png'
    # The udev rule ships inside the package so that the deb can install it
    # by itself; otherwise the app installs but cannot open the controller.
    - from: packaging/linux/udev
      to: build
      filter:
        - '*.rules'

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
  extraResources:
    - from: build
      to: build
      filter:
        - '*.png'
    # FPS helper (ETW). Built separately with `npm run build:helper` because it
    # needs the .NET SDK on Windows; the folder always exists so a build
    # without it still produces a working installer, just without FPS.
    - from: helper/publish/win-x64
      to: helper
      filter:
        - MyRgb.Helper.exe

deb:
  # Runs as root during `dpkg -i`: puts the udev rule in place so the app
  # can open the controller without extra steps.
  afterInstall: packaging/linux/after-install.sh

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MyRGB
  deleteAppDataOnUninstall: false
