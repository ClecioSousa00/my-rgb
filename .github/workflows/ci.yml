name: CI

on:
  push:
    branches: [dev, main, 'feat/**']
  pull_request:
    branches: [dev, main]

# The workflows only read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # `conflict.test.ts` is skipped on CI: it inspects real processes and is
      # unreliable on a shared runner. It still runs locally. The list lives in
      # package.json so the release workflow can run exactly the same gate.
      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build

  # Proves the Windows side still packages: the .NET helper compiles, the
  # native HID prebuild lands in the right place and the app directory is
  # produced. The NSIS installer itself is generated by release.yml.
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      # The same test runs on the Ubuntu job above. Both compare against the
      # committed golden fixture, so a green pair is a byte-for-byte proof
      # that the Windows and Linux builds render the identical frames.
      - name: Run Linux/Windows parity test
        run: npm run test:parity

      - name: Build the FPS helper
        run: npm run build:helper

      - name: Build the Windows app directory
        run: npm run build:win:dir

      - name: Check the packaged layout
        shell: pwsh
        run: |
          $root = 'release/win-unpacked'
          $required = @(
            "$root/MyRGB.exe",
            "$root/resources/helper/MyRgb.Helper.exe",
            "$root/resources/build/icon.png",
            "$root/resources/build/tray.png"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Missing from the package:`n$($missing -join "`n")"
            exit 1
          }
          Write-Host 'Windows package layout OK'
