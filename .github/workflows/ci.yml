name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run tests/store.test.ts tests/patterns.test.ts tests/palette.test.ts tests/color.test.ts tests/protocol.test.ts tests/effects.test.ts tests/documentation.test.ts tests/zone-apply.test.ts

      - name: Build
        run: npm run build
